name: 功能与文档建议
description: 提出使用场景、文档改进、翻译或复现支持建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        文档、翻译和问题复现贡献都欢迎，请先搜索已有 Issues。
        安卓尚未包含在公开仓库，提出后续需求时请区分当前功能与计划。
        安全漏洞请先阅读 [SECURITY.md](https://github.com/mill-ditchy/echo-insight/blob/main/SECURITY.md)，不要在此公开利用步骤或凭证。
  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 功能或使用体验
        - 文档或排查说明
        - 翻译
        - 问题复现与测试反馈
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前困难
      description: 说明涉及的平台、入口或文档位置，不必先提出技术实现。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前办法、替代方案或可提供的帮助（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查
      options:
        - label: 我未附带账号凭证、私人数据或安全漏洞利用细节。
          required: true
