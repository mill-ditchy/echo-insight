name: Project checks

'on':
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev-windows-py311.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check installed dependency snapshot
        run: python scripts/lock_dependencies.py --check
      - name: Scan committed release contents
        run: python scripts/release.py check --ref HEAD
      - name: Parse PowerShell scripts
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $ParseTokens = $null
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$ParseTokens, [ref]$ParseErrors) | Out-Null
            if ($ParseErrors.Count -gt 0) { throw "PowerShell syntax error: $($_.Name)" }
          }
      - name: Run Python and frontend regressions
        run: python scripts/verify_project.py
      - name: Check first startup with empty settings
        run: python scripts/smoke_test.py
